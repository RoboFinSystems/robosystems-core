version: 2

updates:
  # npm — package.json only (this repo does not commit a lockfile)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    # Routine minor/patch churn arrives as two PRs instead of a dozen.
    # Majors are deliberately left ungrouped: they need individual triage,
    # and grouping them would force an all-or-nothing call on unrelated bumps.
    # That matters more here than in the apps — this package is consumed by
    # all three frontends, so a major on its public surface lands on them.
    # vite-toolchain is the exception and is listed first (a dependency joins
    # the first group it matches): those packages are peer-locked to each
    # other, so they are already one decision.
    groups:
      # vitest peers vite, @vitest/coverage-v8 peers vitest at an exact
      # version, and @vitejs/plugin-react peers vite. No update-types filter,
      # so majors travel together. This repo is still on plugin-react ^4 while
      # the apps have moved to ^6 + vite ^8; when that move happens here it
      # has to be one PR, because plugin-react 6 requires vite ^8 and the two
      # arriving separately deadlocks both.
      vite-toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - '@vitest/*'
      npm-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Blocked upstream, not by us: eslint-plugin-jsx-a11y (6.10.2, latest)
      # peers eslint "^3 || ... || ^9" and eslint-plugin-react (7.37.5) caps at
      # ^9.7, so eslint 10 fails `npm install` with ERESOLVE and can never go
      # green. Drop this entry once either plugin ships ESLint 10 peer support.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      # Same wall: @eslint/js ships with the ESLint 10 line, so taking it alone
      # would desynchronise the config package from the linter running it.
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
      # Blocked upstream: @typescript-eslint/eslint-plugin (8.65.0, latest)
      # peers typescript ">=4.8.4 <6.1.0". TypeScript 7 is also the native Go
      # port, so it is a migration to schedule rather than a bump to take.
      # Drop this entry once typescript-eslint v9 supports the 7.x line.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @types/node tracks the runtime floor, not npm's cadence. This package
      # declares engines >=22.0.0, and as a library consumed by all three
      # frontends it has to keep compiling for the oldest Node it claims to
      # support — so the types belong on 22 even when newer ones exist. Newer
      # types would let code referencing Node 24+ APIs typecheck clean here
      # and still break a consumer on Node 22. Drop this entry when engines
      # moves off >=22.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions — pinned action versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    # Same split: routine SHA re-pins batch into one PR, majors stay separate
    # so a wanted major is not tied to an unwanted one.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
