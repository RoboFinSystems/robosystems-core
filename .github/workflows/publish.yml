name: Publish to npm

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if already published
        id: check-published
        run: |
          # Check if this version is already published to npm
          if npm view @robosystems/core@${{ steps.version.outputs.version }} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} is already published"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} is not yet published"
          fi

      - name: Setup Node.js
        if: steps.check-published.outputs.already_published == 'false'
        uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.x, which supports OIDC trusted publishing to
          # npm (token-less). Node 22's npm 10.x does not, so `npm publish`
          # falls back to token auth and fails with ENEEDAUTH on CI. This
          # matches the sibling packages (report-components, typescript-client).
          node-version: '24'

      - name: Install dependencies
        if: steps.check-published.outputs.already_published == 'false'
        run: npm install

      - name: Build
        if: steps.check-published.outputs.already_published == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check-published.outputs.already_published == 'false'
        # The package is published FROM dist/ (prepare-package.mjs assembles
        # dist/package.json) so compiled files sit at the package root.
        run: npm publish ./dist --provenance --access public

      - name: Create summary
        if: steps.check-published.outputs.already_published == 'false'
        run: |
          echo "## 📦 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** [@robosystems/core](https://www.npmjs.com/package/@robosystems/core)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install @robosystems/core@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
